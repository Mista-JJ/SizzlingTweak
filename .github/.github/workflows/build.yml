name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 -fobjc-arc -dynamiclib -framework Foundation bypassEnti.m -o bypassEnti.dylib
          codesign -f -s - bypassEnti.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: bypassEnti
          path: bypassEnti.dylib
